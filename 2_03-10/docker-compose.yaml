services:
 frontend:
  image: syncopated1/frontenduh
  ports:
   - 5001:5001
  environment:
   - REACT_APP_BACKEND_URL=http://127.0.0.1:8080
  command: serve -s -l 5001 build
 backend:
  image: syncopated1/backenduh
  ports:
   - 8080:8080
  environment: 
   - PORT=8080
   - REQUEST_ORIGIN=http://localhost:5001
  command: ./server
