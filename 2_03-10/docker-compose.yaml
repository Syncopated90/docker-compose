services:
 frontend:
  image: syncopated1/frontenduh
  ports:
   - 5001:5001
  environment:
   - REACT_APP_BACKEND_URL=http://127.0.0.1:8080
  command: serve -s -l 5001 build
 backend:
  image: syncopated1/backenduh
  ports:
   - 8080:8080
  environment: 
   - PORT=8080
   - REQUEST_ORIGIN=http://localhost:8080
   - REDIS_HOST=redis_store
   - POSTGRES_USER=postgres
   - POSTGRES_PASSWORD=postgres
   - POSTGRES_DB=postgres
   - POSTGRES_HOST=db
  command: ./server
 redis_store:
  image: redis:latest
 db:
  image: postgres:18
  restart: unless-stopped
  volumes:
   #- type: bind
   #  source: ./database
   #  target: /var/lib/postgresql
   - ./database:/var/lib/postgresql
  environment:
   - POSTGRES_USER=postgres
   - POSTGRES_PASSWORD=postgres
   - POSTGRES_DB=postgres
 nginx:
  image: nginx
  ports:
   - 8000:80
  volumes:
   - ./nginx.conf:/etc/nginx/nginx.conf
  depends_on:
   - frontend
   - backend
 
